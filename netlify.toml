# Retired services catalogue and retired working-together page -> contact
[[redirects]]
 from = "/services"
 to = "/contact"
 status = 301

[[redirects]]
 from = "/services/*"
 to = "/contact"
 status = 301

[[redirects]]
 from = "/working-together"
 to = "/contact"
 status = 301

# Success redirects for form submissions
[[redirects]]
 from = "/contact/success"
 to = "/contact"
 status = 302

[[redirects]]
 from = "/testimonials/success"
 to = "/testimonials"
 status = 302

# Client-routed pages that react-snap does not prerender (private, unlisted).
# They rewrite to the empty react-snap shell (200.html), not to index.html:
# index.html is the prerendered homepage, and hydrating that markup on another
# route throws away the whole tree. Every public page and every project and
# blog detail page is prerendered as a file, so nothing else needs a rewrite.
[[redirects]]
 from = "/story"
 to = "/200.html"
 status = 200

[[redirects]]
 from = "/prayer"
 to = "/200.html"
 status = 200

# Anything else is a real 404. Prerendered routes exist as files and win over
# this rule, so only genuinely unknown paths reach it.
[[redirects]]
 from = "/*"
 to = "/404.html"
 status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

# Private, unlisted pages. They are kept out of search with a header rather
# than a robots.txt Disallow: a Disallow line would advertise the paths to
# anyone reading robots.txt, and it would stop crawlers from fetching the page
# and seeing that it must not be indexed.
[[headers]]
  for = "/story"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/prayer"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
